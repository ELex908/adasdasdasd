<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Create Account</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #121212;
            color: #e0e0e0;
        }
        .container {
            background: rgba(28, 28, 45, 0.95);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            width: 380px;
        }
        .form-container { display: none; }
        .form-container.active { display: block; }
        h2 {
            text-align: center;
            margin-bottom: 24px;
            color: #ffffff;
            font-size: 24px;
        }
        .input-group {
            margin-bottom: 18px;
        }
        .input-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            color: #aaa;
            font-weight: 600;
        }
        .input-wrapper {
            position: relative;
        }
        .input-wrapper i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #777;
            font-size: 15px;
            transition: color 0.3s;
        }
        .input-wrapper input {
            width: 100%;
            padding: 12px 14px 12px 42px;
            background: rgba(255, 255, 255, 0.06);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            font-size: 15px;
            color: #e0e0e0;
            transition: border-color 0.3s, background 0.3s;
            outline: none;
        }
        .input-wrapper input::placeholder { color: #666; }
        .input-wrapper input:focus {
            border-color: #6c63ff;
            background: rgba(255, 255, 255, 0.09);
        }
        .input-wrapper input:focus ~ i { color: #6c63ff; }
        .btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
            transition: background 0.3s, transform 0.1s;
            color: white;
        }
        .btn:active { transform: scale(0.98); }
        .btn-primary {
            background: linear-gradient(135deg, #6c63ff, #4a4ae0);
        }
        .btn-primary:hover { background: linear-gradient(135deg, #7a72ff, #5a5af0); }
        .switch-text {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #888;
        }
        .switch-text a {
            color: #6c63ff;
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
        }
        .switch-text a:hover { text-decoration: underline; }
        .msg {
            font-size: 14px;
            padding: 10px 14px;
            border-radius: 8px;
            margin-top: 14px;
            display: none;
            align-items: center;
            gap: 8px;
        }
        .msg.error { display: flex; background: rgba(255, 80, 80, 0.12); color: #ff8888; border: 1px solid rgba(255, 80, 80, 0.3); }
        .msg.success { display: flex; background: rgba(80, 255, 150, 0.1); color: #7fe0a8; border: 1px solid rgba(80, 255, 150, 0.3); }
    </style>
</head>
<body>
    <div class="container">
        <div id="loginForm" class="form-container active">
            <h2><i class="fa-solid fa-lock"></i> Login</h2>
            <div class="input-group">
                <label for="loginEmail">Email</label>
                <div class="input-wrapper">
                    <input type="email" id="loginEmail" placeholder="Enter your email">
                    <i class="fa-solid fa-envelope"></i>
                </div>
            </div>
            <div class="input-group">
                <label for="loginPassword">Password</label>
                <div class="input-wrapper">
                    <input type="password" id="loginPassword" placeholder="Enter your password">
                    <i class="fa-solid fa-key"></i>
                </div>
            </div>
            <button class="btn btn-primary" onclick="login()"><i class="fa-solid fa-right-to-bracket"></i> Login</button>
            <div class="msg" id="loginMsg"></div>
            <div class="switch-text">
                <i class="fa-regular fa-user"></i> Don't have an account? <a onclick="showForm('signup')">Sign up</a>
            </div>
        </div>

        <div id="signupForm" class="form-container">
            <h2><i class="fa-solid fa-user-plus"></i> Create Account</h2>
            <div class="input-group">
                <label for="signupName">Full Name</label>
                <div class="input-wrapper">
                    <input type="text" id="signupName" placeholder="Enter your name">
                    <i class="fa-solid fa-user"></i>
                </div>
            </div>
            <div class="input-group">
                <label for="signupEmail">Email</label>
                <div class="input-wrapper">
                    <input type="email" id="signupEmail" placeholder="Enter your email">
                    <i class="fa-solid fa-envelope"></i>
                </div>
            </div>
            <div class="input-group">
                <label for="signupPassword">Password</label>
                <div class="input-wrapper">
                    <input type="password" id="signupPassword" placeholder="Create a password">
                    <i class="fa-solid fa-key"></i>
                </div>
            </div>
            <div class="input-group">
                <label for="signupConfirm">Confirm Password</label>
                <div class="input-wrapper">
                    <input type="password" id="signupConfirm" placeholder="Confirm your password">
                    <i class="fa-solid fa-shield-halved"></i>
                </div>
            </div>
            <button class="btn btn-primary" onclick="signup()"><i class="fa-solid fa-user-plus"></i> Create Account</button>
            <div class="msg" id="signupMsg"></div>
            <div class="switch-text">
                <i class="fa-solid fa-right-to-bracket"></i> Already have an account? <a onclick="showForm('login')">Login</a>
            </div>
        </div>
    </div>

    <script>
        function showMsg(el, text, type) {
            el.className = 'msg ' + type;
            el.innerHTML = '<i class="fa-solid ' + (type === 'error' ? 'fa-circle-exclamation' : 'fa-circle-check') + '"></i> ' + text;
        }
        function showForm(form) {
            document.getElementById('loginForm').classList.remove('active');
            document.getElementById('signupForm').classList.remove('active');
            if (form === 'login') {
                document.getElementById('loginForm').classList.add('active');
            } else {
                document.getElementById('signupForm').classList.add('active');
            }
        }

        function signup() {
            const name = document.getElementById('signupName').value.trim();
            const email = document.getElementById('signupEmail').value.trim().toLowerCase();
            const pass = document.getElementById('signupPassword').value;
            const confirm = document.getElementById('signupConfirm').value;
            const msg = document.getElementById('signupMsg');

            if (!name || !email || !pass || !confirm) {
                showMsg(msg, 'Please fill in all fields.', 'error');
                return;
            }
            if (!email.includes('@')) {
                showMsg(msg, 'Please enter a valid email.', 'error');
                return;
            }
            if (pass.length < 6) {
                showMsg(msg, 'Password must be at least 6 characters.', 'error');
                return;
            }
            if (pass !== confirm) {
                showMsg(msg, 'Passwords do not match.', 'error');
                return;
            }

            fetch('/api/signup', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, email, password: pass })
            })
                .then(function (res) { return res.json().then(function (d) { return { res: res, d: d }; }); })
                .then(function ({ res, d }) {
                    if (!res.ok) {
                        showMsg(msg, d.error || 'Signup failed.', 'error');
                        return;
                    }
                    showMsg(msg, 'Account created! You can login now.', 'success');
                    setTimeout(function () {
                        showForm('login');
                        document.getElementById('loginEmail').value = email;
                        document.getElementById('loginMsg').className = 'msg';
                    }, 1200);
                })
                .catch(function () { showMsg(msg, 'Server unreachable. Start the backend with: python app.py', 'error'); });
        }

        function login() {
            const email = document.getElementById('loginEmail').value.trim().toLowerCase();
            const pass = document.getElementById('loginPassword').value;
            const msg = document.getElementById('loginMsg');

            if (!email || !pass) {
                showMsg(msg, 'Please enter your email and password.', 'error');
                return;
            }

            fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password: pass })
            })
                .then(function (res) { return res.json().then(function (d) { return { res: res, d: d }; }); })
                .then(function ({ res, d }) {
                    if (!res.ok) {
                        showMsg(msg, d.error || 'Login failed.', 'error');
                        return;
                    }
                    window.location.href = 'dashboard.html';
                })
                .catch(function () { showMsg(msg, 'Server unreachable. Start the backend with: python app.py', 'error'); });
        }
    </script>
</body>
</html>
