<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dev Panel - Figma2ImGui</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #121212;
            color: #e0e0e0;
            min-height: 100vh;
        }
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 28px;
            background: #1c1c2d;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }
        .brand {
            font-size: 20px;
            font-weight: 700;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .brand i { color: #6c63ff; }
        .btn-nav {
            background: #26263d;
            color: #e0e0e0;
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            transition: background 0.3s;
        }
        .btn-nav:hover { background: #2e2e48; }

        main { max-width: 1100px; margin: 0 auto; padding: 30px 28px 60px; }
        .section {
            background: #1c1c2d;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 24px;
            margin-bottom: 30px;
        }
        .section h3 {
            color: #fff;
            font-size: 18px;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .section h3 i { color: #6c63ff; }
        .section .sub { color: #888; font-size: 14px; margin-bottom: 18px; }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 18px;
            margin-bottom: 30px;
        }
        .card {
            background: #1c1c2d;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .card i {
            font-size: 28px;
            color: #6c63ff;
            background: rgba(108, 99, 255, 0.15);
            border-radius: 12px;
            width: 54px;
            height: 54px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card .value { font-size: 26px; font-weight: 700; color: #fff; }
        .card .label { font-size: 13px; color: #888; }

        .dev-table-wrap { overflow-x: auto; border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 10px; }
        .dev-table { width: 100%; border-collapse: collapse; font-size: 14px; }
        .dev-table th {
            text-align: left;
            padding: 12px 16px;
            color: #888;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            background: #191929;
        }
        .dev-table td {
            padding: 12px 16px;
            color: #e0e0e0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }
        .dev-table tr:last-child td { border-bottom: none; }
        .dev-table tr:hover td { background: rgba(108, 99, 255, 0.06); }
        .dev-table .person { display: flex; align-items: center; gap: 10px; font-weight: 600; }
        .dev-table .avatar {
            width: 32px; height: 32px; border-radius: 50%;
            background: linear-gradient(135deg, #6c63ff, #4a4ae0);
            display: flex; align-items: center; justify-content: center;
            font-weight: 700; font-size: 13px; color: #fff;
        }
        .dev-table .file { color: #aaa; font-size: 13px; word-break: break-all; }
        .dev-table .time { color: #888; font-size: 13px; white-space: nowrap; }
        .badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; }
        .badge.queued { background: rgba(255, 180, 80, 0.12); color: #ffb454; border: 1px solid rgba(255, 180, 80, 0.3); }
        .badge.sent { background: rgba(80, 255, 150, 0.1); color: #7fe0a8; border: 1px solid rgba(80, 255, 150, 0.3); }
        .badge.done { background: rgba(108, 99, 255, 0.12); color: #9a95ff; border: 1px solid rgba(108, 99, 255, 0.3); }
        .btn-small {
            background: #26263d;
            color: #e0e0e0;
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 7px 14px;
            border-radius: 7px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 7px;
            transition: background 0.3s;
        }
        .btn-small:hover { background: #2e2e48; }
        .btn-small.done { background: rgba(80, 255, 150, 0.1); border-color: rgba(80, 255, 150, 0.3); color: #7fe0a8; cursor: default; }
        .dev-empty { text-align: center; color: #888; padding: 40px 0; font-size: 14px; }
        .dev-empty i { font-size: 36px; color: #4a4ae0; display: block; margin-bottom: 10px; }
        .btn-refresh {
            background: #26263d;
            color: #e0e0e0;
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 9px 15px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn-refresh:hover { background: #2e2e48; }
    </style>
</head>
<body>

    <div class="navbar">
        <div class="brand"><i class="fa-solid fa-screwdriver-wrench"></i> Dev Panel</div>
        <a class="btn-nav" href="dashboard.html"><i class="fa-solid fa-arrow-left"></i> Back to Dashboard</a>
    </div>

    <main id="devContent">
        <div class="stats">
            <div class="card">
                <i class="fa-solid fa-user-group"></i>
                <div><div class="value" id="statPeople">0</div><div class="label">People</div></div>
            </div>
            <div class="card">
                <i class="fa-solid fa-file-import"></i>
                <div><div class="value" id="statFiles">0</div><div class="label">Files</div></div>
            </div>
            <div class="card">
                <i class="fa-regular fa-clock"></i>
                <div><div class="value" id="statWaiting">0</div><div class="label">Waiting</div></div>
            </div>
            <div class="card">
                <i class="fa-solid fa-paper-plane"></i>
                <div><div class="value" id="statSent">0</div><div class="label">Sent Back</div></div>
            </div>
        </div>

        <div class="section">
            <div style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px;">
                <h3><i class="fa-solid fa-people-arrows"></i> Everyone Who Converted</h3>
                <button class="btn-refresh" onclick="loadDevPanel()"><i class="fa-solid fa-rotate"></i> Refresh</button>
            </div>
            <p class="sub">Take the work, do it, and send it back to them.</p>

            <div class="dev-table-wrap">
                <table class="dev-table">
                    <thead>
                        <tr>
                            <th>Person</th>
                            <th>File</th>
                            <th>Time</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="devList"></tbody>
                </table>
            </div>
            <div id="devEmpty" class="dev-empty">
                <i class="fa-regular fa-inbox"></i>
                <p>No conversions yet. Drop a Figma file on the dashboard and they'll show up here.</p>
            </div>
        </div>
    </main>

    <input type="file" id="zipInput" accept=".zip,application/zip" hidden>

<script>
        let conversions = [];

        function checkAccess() {
            return fetch('/api/me')
                .then(function (res) {
                    if (!res.ok) { window.location.replace('dashboard.html'); return false; }
                    return res.json();
                })
                .then(function (d) {
                    if (!d || !d.is_dev) { window.location.replace('dashboard.html'); return false; }
                    return true;
                })
                .catch(function () { window.location.replace('dashboard.html'); return false; });
        }

        function loadDevPanel() {
            checkAccess().then(function (ok) {
                if (!ok) return;
                fetch('/api/conversions')
                    .then(function (res) {
                        if (!res.ok) throw new Error(res.status);
                        return res.json();
                    })
                    .then(function (data) {
                        conversions = data || [];
                        renderDevPanel();
                    })
                    .catch(function () { conversions = []; renderDevPanel(); });
            });
        }

        function renderDevPanel() {
            const list = document.getElementById('devList');
            const empty = document.getElementById('devEmpty');
            list.innerHTML = '';

            document.getElementById('statPeople').textContent = conversions.length;
            document.getElementById('statFiles').textContent = conversions.length;
            document.getElementById('statWaiting').textContent = conversions.filter(c => c.status === 'queued').length;
            document.getElementById('statSent').textContent = conversions.filter(c => c.status === 'sent').length;

            if (!conversions.length) {
                empty.style.display = 'block';
                return;
            }
            empty.style.display = 'none';

            conversions.forEach((c, i) => {
                const row = document.createElement('tr');
                row.innerHTML =
                    '<td><div class="person"><div class="avatar">' + c.initials + '</div>' + c.name + (c.email ? '<div style="font-weight:400; font-size:12px; color:#888;">' + c.email + '</div>' : '') + '</div></td>' +
                    '<td><div class="file"><i class="fa-solid fa-file"></i> ' + c.file + '</div></td>' +
                    '<td><span class="time"><i class="fa-regular fa-clock"></i> ' + c.time + '</span></td>' +
                    '<td><span class="badge ' + (c.status === 'queued' ? 'queued' : 'sent') + '">' + (c.status === 'queued' ? 'Coding...' : 'Sent') + '</span></td>' +
                    '<td>' + (c.status === 'queued'
                        ? '<div style="display:flex; gap:8px;">' +
                          '<button class="btn-small" onclick="pickZip(' + i + ')"><i class="fa-solid fa-paper-plane"></i> Send Back</button>' +
                          '<button class="btn-small" onclick="downloadFile(' + i + ')"><i class="fa-solid fa-download"></i> Fig File</button>' +
                          '</div>'
                        : '<div style="display:flex; gap:8px;">' +
                          '<span class="btn-small done"><i class="fa-solid fa-check"></i> Sent by enzo.dev</span>' +
                          (c.zip_name ? '<button class="btn-small" onclick="downloadZip(' + i + ')"><i class="fa-solid fa-file-zipper"></i> Zip</button>' : '') +
                          '</div>') + '</td>';
                list.appendChild(row);
            });
        }

        let pendingSendIndex = null;

        function pickZip(index) {
            pendingSendIndex = index;
            document.getElementById('zipInput').value = '';
            document.getElementById('zipInput').click();
        }

        document.getElementById('zipInput').addEventListener('change', function () {
            const file = this.files[0];
            if (!file || pendingSendIndex === null) return;
            if (!file.name.toLowerCase().endsWith('.zip')) {
                alert('Please pick a .zip file to send back.');
                return;
            }
            const conv = conversions[pendingSendIndex];
            pendingSendIndex = null;
            const fd = new FormData();
            fd.append('file', file);
            fetch('/api/conversions/' + conv.id + '/sendback', { method: 'POST', body: fd })
                .then(function () { loadDevPanel(); })
                .catch(function () {});
        });

        function sendBack(index) {
            const conv = conversions[index];
            if (!conv) return;
            fetch('/api/conversions/' + conv.id + '/sendback', { method: 'POST' })
                .then(function () { loadDevPanel(); })
                .catch(function () {});
        }

        function downloadFile(index) {
            const conv = conversions[index];
            if (!conv) return;
            window.location.href = '/api/conversions/' + conv.id + '/download';
        }

        function downloadZip(index) {
            const conv = conversions[index];
            if (!conv) return;
            window.location.href = '/api/conversions/' + conv.id + '/delivery';
        }

        loadDevPanel();
    </script>
</body>
</html>
